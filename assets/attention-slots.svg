<svg xmlns="http://www.w3.org/2000/svg" width="900" height="645" viewBox="0 0 900 645">
<title>普通 weight 布局中的 K 行写入与 V 列写入</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#627987"/></marker></defs>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="20" y="30" font-size="20" fill="#183D52" font-weight="600" text-anchor="start">slot=645 · D=256 · R=1024 · 物理 block=128×64 BF16</text>
<text x="20" y="75" font-size="22" fill="#183D52" font-weight="600" text-anchor="start">K[R,D]：一行拆成 4 段</text>
<rect x="25" y="105" width="194" height="145" rx="1" fill="#edf2f6" stroke="#B6CBD5" stroke-width="1.5"/>
<rect x="25" y="134" width="194" height="12" rx="0" fill="#E7F3F3" stroke="#147D89" stroke-width="1.5"/>
<text x="122" y="194" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">block 20</text>
<text x="122" y="224" font-size="17" fill="#627987" font-weight="400" text-anchor="middle">128 行 × 64 列</text>
<rect x="243" y="105" width="194" height="145" rx="1" fill="#edf2f6" stroke="#B6CBD5" stroke-width="1.5"/>
<rect x="243" y="134" width="194" height="12" rx="0" fill="#E7F3F3" stroke="#147D89" stroke-width="1.5"/>
<text x="340" y="194" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">block 21</text>
<text x="340" y="224" font-size="17" fill="#627987" font-weight="400" text-anchor="middle">128 行 × 64 列</text>
<rect x="461" y="105" width="194" height="145" rx="1" fill="#edf2f6" stroke="#B6CBD5" stroke-width="1.5"/>
<rect x="461" y="134" width="194" height="12" rx="0" fill="#E7F3F3" stroke="#147D89" stroke-width="1.5"/>
<text x="558" y="194" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">block 22</text>
<text x="558" y="224" font-size="17" fill="#627987" font-weight="400" text-anchor="middle">128 行 × 64 列</text>
<rect x="679" y="105" width="194" height="145" rx="1" fill="#edf2f6" stroke="#B6CBD5" stroke-width="1.5"/>
<rect x="679" y="134" width="194" height="12" rx="0" fill="#E7F3F3" stroke="#147D89" stroke-width="1.5"/>
<text x="776" y="194" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">block 23</text>
<text x="776" y="224" font-size="17" fill="#627987" font-weight="400" text-anchor="middle">128 行 × 64 列</text>
<text x="25" y="286" font-size="20" fill="#203D4D" font-weight="400" text-anchor="start">row_block=5，row_in_block=5；每段写 64 个 BF16 元素。</text>
<text x="20" y="344" font-size="22" fill="#183D52" font-weight="600" text-anchor="start">V[D,R]：一列拆成 2 段</text>
<rect x="25" y="372" width="400" height="145" rx="1" fill="#edf2f6" stroke="#B6CBD5" stroke-width="1.5"/>
<rect x="56" y="372" width="12" height="145" rx="0" fill="#E7F3F3" stroke="#147D89" stroke-width="1.5"/>
<text x="251" y="434" font-size="23" fill="#183D52" font-weight="600" text-anchor="middle">block 10</text>
<text x="251" y="470" font-size="19" fill="#627987" font-weight="400" text-anchor="middle">128 行 × 64 列</text>
<rect x="461" y="372" width="400" height="145" rx="1" fill="#edf2f6" stroke="#B6CBD5" stroke-width="1.5"/>
<rect x="492" y="372" width="12" height="145" rx="0" fill="#E7F3F3" stroke="#147D89" stroke-width="1.5"/>
<text x="687" y="434" font-size="23" fill="#183D52" font-weight="600" text-anchor="middle">block 26</text>
<text x="687" y="470" font-size="19" fill="#627987" font-weight="400" text-anchor="middle">128 行 × 64 列</text>
<text x="25" y="555" font-size="20" fill="#203D4D" font-weight="400" text-anchor="start">col_block=10，col_in_block=5；每段写 128 个 BF16 元素。</text>
<text x="18" y="633" font-size="18" fill="#627987" font-weight="400" text-anchor="start">普通 weight 路径：K 页内沿用 normal；V 不同于专用 vcache。分页寻址另有契约。</text>
</g></svg>
