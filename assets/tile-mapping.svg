<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390">
<title>2500 个元素在两个核上的块分配</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#627987"/></marker></defs>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="18" y="30" font-size="20" fill="#183D52" font-weight="600" text-anchor="start">numel = 2500     BLOCK = 1024     CORE_NUM = 2</text>
<rect x="18" y="65" width="270" height="90" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="153.0" y="105.0" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">tile 0</text>
<text x="153.0" y="135.0" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">[0, 1024)</text>
<rect x="312" y="65" width="270" height="90" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="447.0" y="105.0" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">tile 1</text>
<text x="447.0" y="135.0" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">[1024, 2048)</text>
<rect x="606" y="65" width="270" height="90" rx="8" fill="#FFF2DC" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="741.0" y="105.0" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">tile 2</text>
<text x="741.0" y="135.0" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">[2048, 2500)</text>
<rect x="18" y="245" width="565" height="78" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="300.5" y="279.0" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">Core 0</text>
<text x="300.5" y="309.0" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">2 个 tile · 2048 个有效元素</text>
<rect x="606" y="245" width="270" height="78" rx="8" fill="#FFF2DC" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="741.0" y="279.0" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">Core 1</text>
<text x="741.0" y="309.0" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">1 个 tile · 452 个有效元素</text>
<polyline points="153,155 153,205 300,205 300,245" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="447,155 447,205 300,205" fill="none" stroke="#627987" stroke-width="2"/>
<polyline points="741,155 741,245" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="721" y="201" font-size="18" fill="#627987" font-weight="400" text-anchor="end">572 个补齐位置</text>
<text x="18" y="378" font-size="18" fill="#627987" font-weight="400" text-anchor="start">最后一个 tile 读越界部分补零，只写回有效的 452 个元素。</text>
</g></svg>
