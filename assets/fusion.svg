<svg xmlns="http://www.w3.org/2000/svg" width="900" height="492" viewBox="0 0 900 492">
<title>融合保留残差输出及其 BF16 舍入</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#627987"/></marker></defs>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="18" y="31" font-size="20" fill="#183D52" font-weight="600" text-anchor="start">独立算子链：两次启动</text>
<rect x="18" y="65" width="211" height="79" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="123.5" y="99.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">Add</text>
<text x="123.5" y="129.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">FP32 加法</text>
<rect x="318" y="65" width="265" height="79" rx="8" fill="#FFF2DC" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="450.5" y="99.5" font-size="22" fill="#B87924" font-weight="600" text-anchor="middle">R = BF16(x + r)</text>
<text x="450.5" y="129.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">写回 residual</text>
<rect x="670" y="65" width="211" height="79" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="775.5" y="99.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">RMSNorm</text>
<text x="775.5" y="129.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">重新读取 R</text>
<polyline points="229,105 318,105" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="583,105 670,105" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="780" y="182" font-size="20" fill="#627987" font-weight="400" text-anchor="middle">→ 输出 y</text>
<text x="18" y="242" font-size="20" fill="#183D52" font-weight="600" text-anchor="start">融合算子：一次启动，保留同样的数值边界</text>
<rect x="18" y="271" width="863" height="151" rx="8" fill="#FFFFFF" stroke="#B6CBD5" stroke-width="1.5"/>
<rect x="36" y="294" width="200" height="79" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="136.0" y="328.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">Add</text>
<text x="136.0" y="358.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">FP32 加法</text>
<rect x="299" y="294" width="260" height="79" rx="8" fill="#FFF2DC" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="429.0" y="328.5" font-size="21" fill="#B87924" font-weight="600" text-anchor="middle">R = BF16(x + r)</text>
<text x="429.0" y="358.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">转换回 FP32 参与归一化</text>
<rect x="624" y="294" width="237" height="79" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="742.5" y="328.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">RMSNorm</text>
<text x="742.5" y="358.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">生成 y</text>
<polyline points="236,334 299,334" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="559,334 624,334" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="429" y="404" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">输出 residual</text>
<text x="742" y="404" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">输出 y</text>
<text x="18" y="480" font-size="18" fill="#627987" font-weight="400" text-anchor="start">融合减少中间结果重读与启动；如果外部仍使用 residual，就必须保留该输出。</text>
</g></svg>
