<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
<title>跨 N tile 复用激活的逻辑存储预算</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#627987"/></marker></defs>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="20" y="30" font-size="20" fill="#183D52" font-weight="600" text-anchor="start">BM=BN=BK=128 · BF16 输入 · FP32 累加</text>
<rect x="20" y="166" width="215" height="115" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="127.5" y="218.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">A tile</text>
<text x="127.5" y="248.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">128 × 128 · 32 KiB</text>
<rect x="310" y="75" width="200" height="85" rx="8" fill="#F0F5F8" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="410.0" y="112.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">W tile 0</text>
<text x="410.0" y="142.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">128 × 128 · 32 KiB</text>
<rect x="562" y="97" width="52" height="52" rx="26" fill="#E7F3F3" stroke="#147D89" stroke-width="1.5"/>
<text x="588" y="131" font-size="27" fill="#147D89" font-weight="600" text-anchor="middle">×</text>
<rect x="680" y="75" width="200" height="100" rx="8" fill="#FFF2DC" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="780.0" y="120.0" font-size="22" fill="#B87924" font-weight="600" text-anchor="middle">acc 0</text>
<text x="780.0" y="150.0" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">128 × 128 · 64 KiB</text>
<polyline points="510,123 562,123" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="614,123 680,123" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="310" y="270" width="200" height="85" rx="8" fill="#F0F5F8" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="410.0" y="307.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">W tile 1</text>
<text x="410.0" y="337.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">128 × 128 · 32 KiB</text>
<rect x="562" y="292" width="52" height="52" rx="26" fill="#E7F3F3" stroke="#147D89" stroke-width="1.5"/>
<text x="588" y="326" font-size="27" fill="#147D89" font-weight="600" text-anchor="middle">×</text>
<rect x="680" y="270" width="200" height="100" rx="8" fill="#FFF2DC" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="780.0" y="315.0" font-size="22" fill="#B87924" font-weight="600" text-anchor="middle">acc 1</text>
<text x="780.0" y="345.0" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">128 × 128 · 64 KiB</text>
<polyline points="510,318 562,318" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="614,318 680,318" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="235,201 270,201 270,58 588,58 588,97" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="235,249 270,249 270,382 588,382 588,344" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="321" font-size="22" fill="#147D89" font-weight="600" text-anchor="start">同一份 A</text>
<text x="20" y="355" font-size="20" fill="#627987" font-weight="400" text-anchor="start">服务两个 N 块</text>
<rect x="20" y="404" width="860" height="89" rx="2" fill="#f5f6f8" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="40" y="439" font-size="22" fill="#183D52" font-weight="600" text-anchor="start">片上 A + 两份 acc：32 + 128 = 160 KiB</text>
<text x="40" y="474" font-size="21" fill="#203D4D" font-weight="400" text-anchor="start">A 双缓冲后为 192 KiB；LDG 侧两份 W 共 64 KiB</text>
<text x="18" y="528" font-size="18" fill="#627987" font-weight="400" text-anchor="start">仅列主要活跃量；W 从 LDG 读取，布局临时量与 L2 Buffer 实际分配另行核对。</text>
</g></svg>
