<svg xmlns="http://www.w3.org/2000/svg" width="900" height="485" viewBox="0 0 900 485">
<title>INT4 输出通道配对与半字节解释</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#627987"/></marker></defs>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="20" y="30" font-size="20" fill="#183D52" font-weight="600" text-anchor="start">逻辑 W[256,K]：同一列 k，前后两组 128 行配对</text>
<rect x="20" y="80" width="380" height="96" rx="8" fill="#F0F5F8" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="210.0" y="123.0" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">W[145,7] = 5</text>
<text x="210.0" y="153.0" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">高四位：0101（5）</text>
<rect x="500" y="80" width="380" height="96" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="690.0" y="123.0" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">W[17,7] = −3</text>
<text x="690.0" y="153.0" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">低四位：1101（D）</text>
<polyline points="210,176 210,215 310,215 310,254" fill="none" stroke="#387EA8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="690,176 690,215 590,215 590,254" fill="none" stroke="#147D89" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="170" y="254" width="70" height="72" rx="0" fill="#F0F5F8" stroke="#ffffff" stroke-width="1.5"/>
<text x="205" y="301" font-size="29" fill="#183D52" font-weight="600" text-anchor="middle">0</text>
<rect x="240" y="254" width="70" height="72" rx="0" fill="#F0F5F8" stroke="#ffffff" stroke-width="1.5"/>
<text x="275" y="301" font-size="29" fill="#183D52" font-weight="600" text-anchor="middle">1</text>
<rect x="310" y="254" width="70" height="72" rx="0" fill="#F0F5F8" stroke="#ffffff" stroke-width="1.5"/>
<text x="345" y="301" font-size="29" fill="#183D52" font-weight="600" text-anchor="middle">0</text>
<rect x="380" y="254" width="70" height="72" rx="0" fill="#F0F5F8" stroke="#ffffff" stroke-width="1.5"/>
<text x="415" y="301" font-size="29" fill="#183D52" font-weight="600" text-anchor="middle">1</text>
<rect x="450" y="254" width="70" height="72" rx="0" fill="#E7F3F3" stroke="#ffffff" stroke-width="1.5"/>
<text x="485" y="301" font-size="29" fill="#183D52" font-weight="600" text-anchor="middle">1</text>
<rect x="520" y="254" width="70" height="72" rx="0" fill="#E7F3F3" stroke="#ffffff" stroke-width="1.5"/>
<text x="555" y="301" font-size="29" fill="#183D52" font-weight="600" text-anchor="middle">1</text>
<rect x="590" y="254" width="70" height="72" rx="0" fill="#E7F3F3" stroke="#ffffff" stroke-width="1.5"/>
<text x="625" y="301" font-size="29" fill="#183D52" font-weight="600" text-anchor="middle">0</text>
<rect x="660" y="254" width="70" height="72" rx="0" fill="#E7F3F3" stroke="#ffffff" stroke-width="1.5"/>
<text x="695" y="301" font-size="29" fill="#183D52" font-weight="600" text-anchor="middle">1</text>
<text x="310" y="363" font-size="22" fill="#387EA8" font-weight="600" text-anchor="middle">高四位：通道 145</text>
<text x="590" y="363" font-size="22" fill="#147D89" font-weight="600" text-anchor="middle">低四位：通道 17</text>
<text x="450" y="418" font-size="24" fill="#183D52" font-weight="600" text-anchor="middle">合成字节 0x5D；随后仍需按 7D 规则重排</text>
<text x="18" y="473" font-size="18" fill="#627987" font-weight="400" text-anchor="start">不是相邻 K 元素配对。读取低四位 D 时，必须保留它表示有符号 −3 的语义。</text>
</g></svg>
