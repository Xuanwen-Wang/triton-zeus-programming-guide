<svg xmlns="http://www.w3.org/2000/svg" width="900" height="405" viewBox="0 0 900 405">
<title>GPU Triton 向 Zeus 的迁移顺序</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#627987"/></marker></defs>
<g font-family="Noto Sans CJK SC, sans-serif">
<rect x="18" y="20" width="264" height="103" rx="8" fill="#F0F5F8" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="150.0" y="66.5" font-size="21" fill="#183D52" font-weight="600" text-anchor="middle">01  固定算子契约</text>
<text x="150.0" y="96.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">形状 · dtype · 布局 · 误差</text>
<rect x="318" y="20" width="264" height="103" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="450.0" y="66.5" font-size="21" fill="#183D52" font-weight="600" text-anchor="middle">02  跑通单核</text>
<text x="450.0" y="96.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">Zeus 运行入口与 ABI</text>
<rect x="618" y="20" width="264" height="103" rx="8" fill="#F0F5F8" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="750.0" y="66.5" font-size="21" fill="#183D52" font-weight="600" text-anchor="middle">03  覆盖尾块</text>
<text x="750.0" y="96.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">非整块 · 动态值 · 边界</text>
<rect x="618" y="213" width="264" height="103" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="750.0" y="259.5" font-size="21" fill="#183D52" font-weight="600" text-anchor="middle">04  核对双核分工</text>
<text x="750.0" y="289.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">输出归属 · 空核 · 同步</text>
<rect x="318" y="213" width="264" height="103" rx="8" fill="#F0F5F8" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="450.0" y="259.5" font-size="21" fill="#183D52" font-weight="600" text-anchor="middle">05  同条件测量</text>
<text x="450.0" y="289.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">基线 · 时间范围 · trace</text>
<rect x="18" y="213" width="264" height="103" rx="8" fill="#F0F5F8" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="150.0" y="259.5" font-size="21" fill="#183D52" font-weight="600" text-anchor="middle">06  框架回归</text>
<text x="150.0" y="289.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">真实调用链 · 输出质量</text>
<polyline points="282,72 318,72" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="582,72 618,72" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="750,123 750,213" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="618,265 582,265" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="318,265 282,265" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="18" y="393" font-size="18" fill="#627987" font-weight="400" text-anchor="start">每一步先满足当前条件，再进入下一步；GPU 的 launch 参数需要重新解释。</text>
</g></svg>
