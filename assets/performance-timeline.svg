<svg xmlns="http://www.w3.org/2000/svg" width="900" height="498" viewBox="0 0 900 498">
<title>串行处理与理想双缓冲的抽象时间轴</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#627987"/></marker></defs>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="18" y="28" font-size="20" fill="#183D52" font-weight="600" text-anchor="start">串行：一个 tile 完整结束后处理下一个</text>
<rect x="171" y="58" width="73" height="47" rx="4" fill="#387EA8" stroke="#387EA8" stroke-width="1.5"/>
<text x="207.5" y="89" font-size="20" fill="#FFFFFF" font-weight="500" text-anchor="middle">L0</text>
<rect x="247" y="58" width="111" height="47" rx="4" fill="#147D89" stroke="#147D89" stroke-width="1.5"/>
<text x="302.5" y="89" font-size="20" fill="#FFFFFF" font-weight="500" text-anchor="middle">C0</text>
<rect x="361" y="58" width="35" height="47" rx="4" fill="#B87924" stroke="#B87924" stroke-width="1.5"/>
<text x="378.5" y="89" font-size="20" fill="#FFFFFF" font-weight="500" text-anchor="middle">S0</text>
<rect x="399" y="58" width="73" height="47" rx="4" fill="#387EA8" stroke="#387EA8" stroke-width="1.5"/>
<text x="435.5" y="89" font-size="20" fill="#FFFFFF" font-weight="500" text-anchor="middle">L1</text>
<rect x="475" y="58" width="111" height="47" rx="4" fill="#147D89" stroke="#147D89" stroke-width="1.5"/>
<text x="530.5" y="89" font-size="20" fill="#FFFFFF" font-weight="500" text-anchor="middle">C1</text>
<rect x="589" y="58" width="35" height="47" rx="4" fill="#B87924" stroke="#B87924" stroke-width="1.5"/>
<text x="606.5" y="89" font-size="20" fill="#FFFFFF" font-weight="500" text-anchor="middle">S1</text>
<rect x="627" y="58" width="73" height="47" rx="4" fill="#387EA8" stroke="#387EA8" stroke-width="1.5"/>
<text x="663.5" y="89" font-size="20" fill="#FFFFFF" font-weight="500" text-anchor="middle">L2</text>
<rect x="703" y="58" width="111" height="47" rx="4" fill="#147D89" stroke="#147D89" stroke-width="1.5"/>
<text x="758.5" y="89" font-size="20" fill="#FFFFFF" font-weight="500" text-anchor="middle">C2</text>
<rect x="817" y="58" width="35" height="47" rx="4" fill="#B87924" stroke="#B87924" stroke-width="1.5"/>
<text x="834.5" y="89" font-size="20" fill="#FFFFFF" font-weight="500" text-anchor="middle">S2</text>
<text x="18" y="89" font-size="21" fill="#203D4D" font-weight="400" text-anchor="start">依次执行</text>
<text x="18" y="171" font-size="20" fill="#183D52" font-weight="600" text-anchor="start">流水：在依赖允许时重叠，覆盖旧缓冲前等待 reader</text>
<text x="18" y="233" font-size="20" fill="#203D4D" font-weight="400" text-anchor="start">LOAD</text>
<polyline points="158,247 867,247" fill="none" stroke="#B6CBD5" stroke-width="2"/>
<text x="18" y="299" font-size="20" fill="#203D4D" font-weight="400" text-anchor="start">COMPUTE</text>
<polyline points="158,313 867,313" fill="none" stroke="#B6CBD5" stroke-width="2"/>
<text x="18" y="365" font-size="20" fill="#203D4D" font-weight="400" text-anchor="start">STORE</text>
<polyline points="158,379 867,379" fill="none" stroke="#B6CBD5" stroke-width="2"/>
<rect x="171" y="202" width="73" height="45" rx="4" fill="#387EA8" stroke="#387EA8" stroke-width="1.5"/>
<text x="207" y="232" font-size="20" fill="#FFFFFF" font-weight="500" text-anchor="middle">L0</text>
<rect x="247" y="202" width="73" height="45" rx="4" fill="#387EA8" stroke="#387EA8" stroke-width="1.5"/>
<text x="283" y="232" font-size="20" fill="#FFFFFF" font-weight="500" text-anchor="middle">L1</text>
<rect x="399" y="202" width="73" height="45" rx="4" fill="#387EA8" stroke="#387EA8" stroke-width="1.5"/>
<text x="435" y="232" font-size="20" fill="#FFFFFF" font-weight="500" text-anchor="middle">L2</text>
<rect x="247" y="268" width="111" height="45" rx="4" fill="#147D89" stroke="#147D89" stroke-width="1.5"/>
<text x="302" y="298" font-size="20" fill="#FFFFFF" font-weight="500" text-anchor="middle">C0</text>
<rect x="361" y="268" width="111" height="45" rx="4" fill="#147D89" stroke="#147D89" stroke-width="1.5"/>
<text x="416" y="298" font-size="20" fill="#FFFFFF" font-weight="500" text-anchor="middle">C1</text>
<rect x="475" y="268" width="111" height="45" rx="4" fill="#147D89" stroke="#147D89" stroke-width="1.5"/>
<text x="530" y="298" font-size="20" fill="#FFFFFF" font-weight="500" text-anchor="middle">C2</text>
<rect x="361" y="334" width="35" height="45" rx="4" fill="#B87924" stroke="#B87924" stroke-width="1.5"/>
<text x="378" y="364" font-size="18" fill="#FFFFFF" font-weight="500" text-anchor="middle">S0</text>
<rect x="475" y="334" width="35" height="45" rx="4" fill="#B87924" stroke="#B87924" stroke-width="1.5"/>
<text x="492" y="364" font-size="18" fill="#FFFFFF" font-weight="500" text-anchor="middle">S1</text>
<rect x="589" y="334" width="35" height="45" rx="4" fill="#B87924" stroke="#B87924" stroke-width="1.5"/>
<text x="606" y="364" font-size="18" fill="#FFFFFF" font-weight="500" text-anchor="middle">S2</text>
<polyline points="399,330 399,252" fill="none" stroke="#627987" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="462" y="420" font-size="20" fill="#627987" font-weight="400" text-anchor="middle">L = load    C = compute    S = store</text>
<text x="462" y="452" font-size="20" fill="#627987" font-weight="400" text-anchor="middle">缓冲槽：tile 0、2 使用 ping；tile 1 使用 pong</text>
<text x="18" y="486" font-size="18" fill="#627987" font-weight="400" text-anchor="start">示意长度不代表实测周期；可否重叠取决于资源、缓冲区和编译器生成的依赖。</text>
</g></svg>
