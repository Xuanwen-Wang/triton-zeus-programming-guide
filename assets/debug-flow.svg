<svg xmlns="http://www.w3.org/2000/svg" width="900" height="405" viewBox="0 0 900 405">
<title>按症状缩小问题范围</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#627987"/></marker></defs>
<g font-family="Noto Sans CJK SC, sans-serif">
<rect x="18" y="20" width="170" height="82" rx="8" fill="#FFF2DC" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="103.0" y="68.0" font-size="22" fill="#B87924" font-weight="600" text-anchor="middle">编译失败</text>
<rect x="242" y="20" width="280" height="82" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="382.0" y="68.0" font-size="21" fill="#183D52" font-weight="600" text-anchor="middle">第一个失败的 IR 阶段</text>
<polyline points="188,61 242,61" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="552" y="52" font-size="20" fill="#203D4D" font-weight="400" text-anchor="start">类型、形状、布局</text>
<text x="552" y="83" font-size="20" fill="#203D4D" font-weight="400" text-anchor="start">接口约束</text>
<rect x="18" y="136" width="170" height="82" rx="8" fill="#FFF2DC" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="103.0" y="184.0" font-size="22" fill="#B87924" font-weight="600" text-anchor="middle">执行异常</text>
<rect x="242" y="136" width="280" height="82" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="382.0" y="184.0" font-size="21" fill="#183D52" font-weight="600" text-anchor="middle">参数与设备访问</text>
<polyline points="188,177 242,177" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="552" y="168" font-size="20" fill="#203D4D" font-weight="400" text-anchor="start">ABI、地址、分配</text>
<text x="552" y="199" font-size="20" fill="#203D4D" font-weight="400" text-anchor="start">所有权与同步</text>
<rect x="18" y="252" width="170" height="82" rx="8" fill="#FFF2DC" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="103.0" y="300.0" font-size="22" fill="#B87924" font-weight="600" text-anchor="middle">输出异常</text>
<rect x="242" y="252" width="280" height="82" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="382.0" y="300.0" font-size="21" fill="#183D52" font-weight="600" text-anchor="middle">数值与有效范围</text>
<polyline points="188,293 242,293" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="552" y="284" font-size="20" fill="#203D4D" font-weight="400" text-anchor="start">输入、舍入、中间值</text>
<text x="552" y="315" font-size="20" fill="#203D4D" font-weight="400" text-anchor="start">有效范围与尾部</text>
<text x="18" y="393" font-size="18" fill="#627987" font-weight="400" text-anchor="start">先固定输入、参数和版本，再减少 kernel 与失败形状；每次只改变一个因素。</text>
</g></svg>
