<text x="173.0" y="265.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">ZeusHigh</text>
<text x="385" y="266" font-size="22" fill="#203D4D" font-weight="400" text-anchor="start">执行单元、描述符与存储分配</text>
<polyline points="173,286 173,303" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="18" y="303" width="310" height="55" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="173.0" y="337.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">ZeusLow</text>
<text x="385" y="338" font-size="22" fill="#203D4D" font-weight="400" text-anchor="start">设备命令、控制流与同步</text>
<polyline points="173,358 173,375" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="18" y="375" width="310" height="55" rx="8" fill="#F0F5F8" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="173.0" y="409.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">.zbin</text>
<text x="385" y="410" font-size="22" fill="#203D4D" font-weight="400" text-anchor="start">供运行时加载的设备程序</text>
<text x="18" y="478" font-size="18" fill="#627987" font-weight="400" text-anchor="start">.S 与 .debug 用于诊断；.o 可封装设备二进制供宿主链接。</text>
