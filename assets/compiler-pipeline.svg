<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490">
<title>Triton Zeus 编译流水线</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#627987"/></marker></defs>
<g font-family="Noto Sans CJK SC, sans-serif">
<rect x="18" y="15" width="310" height="55" rx="8" fill="#F0F5F8" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="173.0" y="49.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">Triton Python</text>
<text x="385" y="50" font-size="22" fill="#203D4D" font-weight="400" text-anchor="start">kernel、signature、constants</text>
<polyline points="173,70 173,87" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="18" y="87" width="310" height="55" rx="8" fill="#F0F5F8" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="173.0" y="121.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">TTIR</text>
<text x="385" y="122" font-size="22" fill="#203D4D" font-weight="400" text-anchor="start">张量形状、类型与指针表达式</text>
<polyline points="173,142 173,159" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="18" y="159" width="310" height="55" rx="8" fill="#F0F5F8" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="173.0" y="193.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">Linalg / MemRef</text>
<text x="385" y="194" font-size="22" fill="#203D4D" font-weight="400" text-anchor="start">结构化计算、循环与缓冲区</text>
