<svg xmlns="http://www.w3.org/2000/svg" width="900" height="405" viewBox="0 0 900 405">
<title>Multi-Executor 与 Parallel-Executor 的区别</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#627987"/></marker></defs>
<g font-family="Noto Sans CJK SC, sans-serif">
<text x="18" y="27" font-size="20" fill="#183D52" font-weight="600" text-anchor="start">Multi-Executor：一个逻辑操作的内部拆分</text>
<rect x="18" y="56" width="240" height="100" rx="8" fill="#F0F5F8" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="138.0" y="101.0" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">操作 A</text>
<text x="138.0" y="131.0" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">一份逻辑输入与输出</text>
<rect x="380" y="56" width="230" height="100" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="495.0" y="101.0" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">A 的分片 0</text>
<text x="495.0" y="131.0" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">执行 lane 0</text>
<rect x="652" y="56" width="230" height="100" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="767.0" y="101.0" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">A 的分片 1</text>
<text x="767.0" y="131.0" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">执行 lane 1</text>
<polyline points="258,106 380,106" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="318,106 318,178 767,178 767,156" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="18" y="226" font-size="20" fill="#183D52" font-weight="600" text-anchor="start">Parallel-Executor：多个完整且独立的逻辑操作</text>
<rect x="18" y="253" width="240" height="99" rx="8" fill="#F0F5F8" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="138.0" y="297.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">独立操作 A、B</text>
<text x="138.0" y="327.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">分别拥有各自的输出</text>
<rect x="380" y="253" width="230" height="99" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="495.0" y="297.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">完整操作 A</text>
<text x="495.0" y="327.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">执行 lane 0</text>
<rect x="652" y="253" width="230" height="99" rx="8" fill="#E7F3F3" stroke="#B6CBD5" stroke-width="1.5"/>
<text x="767.0" y="297.5" font-size="22" fill="#183D52" font-weight="600" text-anchor="middle">完整操作 B</text>
<text x="767.0" y="327.5" font-size="18" fill="#627987" font-weight="400" text-anchor="middle">执行 lane 1</text>
<polyline points="258,303 380,303" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="318,303 318,370 767,370 767,352" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/>
<text x="18" y="393" font-size="18" fill="#627987" font-weight="400" text-anchor="start">是否能够并行由操作、布局、资源与依赖共同决定；图中只示意两个 lane。</text>
</g></svg>
